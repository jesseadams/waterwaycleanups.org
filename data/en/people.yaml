- name: "Sarah Balon"
  function: "Water Quality Monitoring Lead"
  function_lead: true
  description: "Sarah earned her Bachelor's in Environmental Science and has conducted hydrological research on how data center development is affecting local streams and wetlands. Her belief that everyone, including wildlife, has the right to clean water is what led her to performing monthly measurements in two of the creeks that our organization aims to protect - Potomac and Accokeek."
  linkedin: "https://www.linkedin.com/in/sarahbalon/"
